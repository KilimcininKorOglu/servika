name: Validate

on:
  workflow_call:

permissions:
  contents: read

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet (linux/amd64)
        run: GOOS=linux GOARCH=amd64 go vet ./...

      - name: go vet (linux/arm64)
        run: GOOS=linux GOARCH=arm64 go vet ./...

      # The vhost tests shell out to `nginx -t` and skip themselves when no nginx
      # is on PATH, so without this the configuration gates pass by not running.
      - name: nginx (for the configuration syntax tests)
        run: sudo apt-get update && sudo apt-get install -y nginx

      # -count=1 because a cached PASS is not a test run.
      - name: go test
        run: go test -count=1 ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        run: npm ci
        working-directory: frontend

      - name: TypeScript check
        run: npx tsc --noEmit
        working-directory: frontend

      - name: Frontend build
        run: npm run build
        working-directory: frontend

  lint:
    name: Shell and PHP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        run: shellcheck -S warning assets/ops/*

      - name: PHP syntax
        run: |
          for f in assets/phpmyadmin/*.php; do
            php -l "$f"
          done
